version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rework_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rework_password}
      POSTGRES_DB: ${POSTGRES_DB:-rework_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - rework_network
      
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rework_user}:${POSTGRES_PASSWORD:-rework_password}@db:5432/${POSTGRES_DB:-rework_db}
      JWT_SECRET: ${JWT_SECRET:-supersecretkey_change_me_in_prod}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      APP_ENV: production
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - rework_network
      
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    restart: unless-stopped
    networks:
      - rework_network
      
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - rework_network

volumes:
  postgres_prod_data:

networks:
  rework_network:
    driver: bridge
