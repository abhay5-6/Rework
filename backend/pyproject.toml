    "email-validator>=2.1.0",
    "fastapi>=0.110.0",
    "google-genai>=2.0.0",
    "passlib>=1.7.4",
    "pgvector>=0.3.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "python-jose>=3.3.0",
    "python-multipart>=0.0.9",
    "sentence-transformers>=3.0.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.30",
    "torch>=2.2.0",
