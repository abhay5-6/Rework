name: CI

on:
  push:
    branches: [ "develop", "main", "workspace" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  backend-check:
    name: Backend Migrations & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector:v0.5.1-pg15
        env:
          POSTGRES_USER: rework_user
          POSTGRES_PASSWORD: rework_password
          POSTGRES_DB: rework_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rework_user -d rework_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx slowapi psutil

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql://rework_user:rework_password@localhost:5432/rework_test_db
          JWT_SECRET: supersecretkeyfortesting123!
          FRONTEND_URL: http://localhost:3000
          APP_ENV: test
        run: |
          cd backend
          alembic upgrade head

      - name: Run Pytest Integration Suite (AI Stubs Enabled)
        env:
          DATABASE_URL: postgresql+asyncpg://rework_user:rework_password@localhost:5432/rework_test_db
          JWT_SECRET: supersecretkeyfortesting123!
          FRONTEND_URL: http://localhost:3000
          APP_ENV: test
          AI_TEST_MODE: "true"
          AI_ENABLED: "true"
        run: |
          cd backend
          pytest tests/ -v

  frontend-check:
    name: Frontend Typecheck, Lint & Build Gate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Node Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npm run type-check

      - name: Next.js Linter Check
        run: npm run lint

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000

  docker-validate:
    name: Docker Compose & Image Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration Syntax
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Build Backend Docker Image
        run: |
          docker build -t rework-backend:ci ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t rework-frontend:ci ./frontend
