name: CI

on:
  push:
    branches: [ "develop", "main", "workspace" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - run: npm ci
      - run: npm run test
      
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
        
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: rework_user
          POSTGRES_PASSWORD: rework_password
          POSTGRES_DB: rework_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './backend/requirements.txt'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
          
      - name: Set Environment Variables
        run: |
          echo "DATABASE_URL=postgresql://rework_user:rework_password@localhost:5432/rework_test_db" >> $GITHUB_ENV
          echo "JWT_SECRET=supersecretkey" >> $GITHUB_ENV
          echo "FRONTEND_URL=http://localhost:3000" >> $GITHUB_ENV
          echo "APP_ENV=test" >> $GITHUB_ENV
          
      - name: Run Pytest
        run: pytest tests/
